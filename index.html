
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script>
    // Ensure window.fetch has both a getter and setter so browser extensions or monitoring tools can safely intercept window.fetch
    (function() {
      try {
        var originalFetch = window.fetch;
        if (originalFetch) {
          var _currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return _currentFetch; },
            set: function(val) { _currentFetch = val; },
            configurable: true,
            enumerable: true
          });
        }
      } catch (e) {
        console.warn("Fetch descriptor setup: ", e);
      }
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            navy: {
              950: '#071426', // primary canvas background
              900: '#0B1B31', // secondary surface background
              850: '#0D1E34', // container surface
              800: '#10223A', // card background
              700: '#162A45', // elevated card/input
              600: '#1E3557', // subtle border
              border: '#223955', // main border
            },
            brand: {
              DEFAULT: '#2878FF',
              hover: '#1B66E5',
              dark: '#1450B8',
              light: '#5393FF',
            }
          }
        }
      }
    };
    
    // Always default to dark navy theme matching the design reference
    (function() {
      document.documentElement.classList.add('dark');
    })();
  </script>
  <style>
    body { 
      font-family: 'Inter', sans-serif; 
      -webkit-tap-highlight-color: transparent; 
      background-color: #071426;
      color: #F4F7FC;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .leaflet-container { height: 100%; width: 100%; z-index: 10; border-radius: 1rem; }
    
    /* Smooth transitions */
    * {
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }
  </style>
